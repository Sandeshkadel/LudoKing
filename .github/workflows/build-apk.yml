name: Build Ludo King APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Verify and build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Jest
        run: npm test -- --runInBand

      - name: Simulation smoke (200 games per scenario)
        run: npm run simulate -- 200

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Decode release keystore (if provided)
        id: keystore
        env:
          KS_B64: ${{ secrets.LUDO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release keystore secret set; APK will be debug-signed (test only)."
          fi

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build release APK
        working-directory: android
        env:
          LUDO_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          LUDO_KEYSTORE_PASSWORD: ${{ secrets.LUDO_KEYSTORE_PASSWORD }}
          LUDO_KEY_ALIAS: ${{ secrets.LUDO_KEY_ALIAS }}
          LUDO_KEY_PASSWORD: ${{ secrets.LUDO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name APK and compute checksum
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p releases
          cp android/app/build/outputs/apk/release/app-release.apk "releases/ludo-king-v${VERSION}.apk"
          (cd releases && sha256sum "ludo-king-v${VERSION}.apk" > SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ludo-king-apk
          path: releases/
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ludo King v${{ steps.apk.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            releases/ludo-king-v${{ steps.apk.outputs.version }}.apk
            releases/SHA256SUMS.txt
          prerelease: ${{ steps.keystore.outputs.signed != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
